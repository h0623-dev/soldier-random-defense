name: Android 시험 빌드
on:
  push: { branches: [main, "claude/**"] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 자동 업데이트 파일 배포용 (Cloudflare Pages). 저장소 Settings → Secrets and variables → Actions 에 넣는다.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm test
      - name: 빌드 번호 매기기 · 업데이트 파일 만들기
        run: npm run bundle
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: soldier-random-defense-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: 자동 업데이트 파일 배포 (main 브랜치, 배포 설정이 있을 때만)
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CF_PAGES_PROJECT != ''
        run: npx --yes wrangler@4 pages deploy dist/update --project-name="$CF_PAGES_PROJECT" --branch=main --commit-dirty=true
