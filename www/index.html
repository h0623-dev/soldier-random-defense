<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b2118">
<title>군인 랜덤 디펜스</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="area"><span data-ic="flag"></span><div><b><span id="h-wave">0</span><em>/100</em></b><small id="h-area">작전 지역</small></div></div>
    <div class="meters">
      <div class="mt"><small>다음 <b id="h-next">-</b></small><span class="bar"><u id="h-nextbar"></u></span></div>
      <div class="mt" id="g-enemy"><small id="h-enemy">적 0/50</small><span class="bar red"><u id="h-enemybar"></u></span></div>
    </div>
    <div class="pill gold"><span data-ic="coin"></span><b id="h-gold">0</b></div>
    <div class="pill sup"><span data-ic="box"></span><b id="h-sup">0</b></div>
    <button id="b-speed" class="hbtn">×1</button>
    <button id="b-menu" class="hbtn" aria-label="메뉴"><span data-ic="menu"></span></button>
  </header>
  <canvas id="field"></canvas>
  <section id="info"></section>
  <!-- 주둔지: 버튼 대신 전장 아래 주둔지의 건물을 누른다. 왼쪽부터 훈련소(천막) · 병기창(병과 강화) · 연병장(신병 소집) · 보급창(선택 소집) · 통신탑(특수 임무) -->
  <footer id="actions">
    <div class="ticker"><p id="t-info">신병을 소집하세요</p><button id="b-mission" class="board"><span data-ic="list"></span>임무 <b id="c-mission"></b></button></div>
    <div class="brief"><img id="brief-img" alt=""><div><small id="brief-w"></small><b id="brief-t"></b><p id="brief-s"></p></div></div>
    <div class="blds">
      <button id="b-camp" class="bld"><svg viewBox="0 0 100 90"><path d="M50 12 L93 80 H7 Z" fill="#8fa86a" stroke="#4a2f1b" stroke-width="3.5" stroke-linejoin="round"/><path d="M50 12 L66 80 H34 Z" fill="#6f8a52" stroke="#4a2f1b" stroke-width="3" stroke-linejoin="round"/><path d="M50 34 L58 80 H42 Z" fill="#3d2a1a"/><path d="M50 12 V2" stroke="#4a2f1b" stroke-width="3" stroke-linecap="round"/><path d="M50 2 L67 7 L50 12 Z" fill="#d0453a" stroke="#4a2f1b" stroke-width="2" stroke-linejoin="round"/><path d="M14 80 L7 86 M86 80 L93 86" stroke="#4a2f1b" stroke-width="2.5" stroke-linecap="round"/></svg><span class="sign"><b id="t-camp">훈련소</b><small id="c-camp"></small></span></button>
      <button id="b-up" class="bld"><svg viewBox="0 0 100 90"><rect x="14" y="42" width="72" height="40" rx="3" fill="#c9a06a" stroke="#4a2f1b" stroke-width="3.5"/><path d="M7 44 L50 16 L93 44 Z" fill="#8a5a3c" stroke="#4a2f1b" stroke-width="3.5" stroke-linejoin="round"/><rect x="41" y="56" width="20" height="26" rx="2" fill="#6b4a2a" stroke="#4a2f1b" stroke-width="3"/><circle cx="50" cy="33" r="8" fill="#f0deb0" stroke="#4a2f1b" stroke-width="2.5"/><path d="M45 37 L55 29 M52 28 l4 0 l0 4" stroke="#4a2f1b" stroke-width="2.6" stroke-linecap="round" fill="none"/><rect x="19" y="64" width="15" height="13" fill="#a9824f" stroke="#4a2f1b" stroke-width="2.5"/><path d="M19 64 L34 77 M34 64 L19 77" stroke="#4a2f1b" stroke-width="1.6"/><rect x="67" y="60" width="13" height="10" rx="2" fill="#bfe3ff" stroke="#4a2f1b" stroke-width="2.5"/></svg><span class="sign"><b>병과 강화</b><small id="c-up"></small></span></button>
      <button id="b-summon" class="bld main"><svg viewBox="0 0 120 100"><path d="M60 20 V3" stroke="#4a2f1b" stroke-width="3.5" stroke-linecap="round"/><path d="M60 3 L82 9 L60 16 Z" fill="#5fd35a" stroke="#4a2f1b" stroke-width="2.5" stroke-linejoin="round"/><rect x="17" y="52" width="86" height="40" rx="4" fill="#fff3c9" stroke="#4a2f1b" stroke-width="3.5"/><path d="M8 54 L60 18 L112 54 Z" fill="#c9473a" stroke="#4a2f1b" stroke-width="3.5" stroke-linejoin="round"/><path d="M28 40 L60 20 L92 40" stroke="#e8776b" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="48" y="64" width="24" height="28" rx="3" fill="#7a4a2a" stroke="#4a2f1b" stroke-width="3"/><circle cx="67" cy="79" r="1.8" fill="#ffd45e"/><rect x="26" y="62" width="15" height="13" rx="2" fill="#bfe3ff" stroke="#4a2f1b" stroke-width="2.5"/><rect x="79" y="62" width="15" height="13" rx="2" fill="#bfe3ff" stroke="#4a2f1b" stroke-width="2.5"/></svg><span class="sign"><b>신병 소집</b><small id="c-summon"></small></span></button>
      <button id="b-pick" class="bld"><svg viewBox="0 0 100 90"><rect x="10" y="52" width="36" height="30" rx="2" fill="#a9824f" stroke="#4a2f1b" stroke-width="3.5"/><rect x="50" y="52" width="40" height="30" rx="2" fill="#b8905a" stroke="#4a2f1b" stroke-width="3.5"/><rect x="27" y="26" width="42" height="28" rx="2" fill="#c9a06a" stroke="#4a2f1b" stroke-width="3.5"/><path d="M10 52 L46 82 M46 52 L10 82 M50 67 H90 M70 52 V82 M27 40 H69" stroke="#4a2f1b" stroke-width="1.8"/><path d="M20 30 Q48 4 76 30 L70 34 Q48 16 26 34 Z" fill="#6f8a52" stroke="#4a2f1b" stroke-width="3" stroke-linejoin="round"/><circle cx="48" cy="40" r="6" fill="#4aa3e8" stroke="#4a2f1b" stroke-width="2.5"/></svg><span class="sign"><b>선택 소집</b><small id="c-pick"></small></span></button>
      <button id="b-elite" class="bld"><svg viewBox="0 0 100 90"><path d="M50 16 L33 80 M50 16 L67 80 M39 58 H61 M36 70 H64 M44 40 H56 M39 58 L61 70 M61 58 L39 70" stroke="#4a2f1b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="26" y="78" width="48" height="9" rx="3" fill="#8d8478" stroke="#4a2f1b" stroke-width="3"/><circle cx="50" cy="13" r="6" fill="#ff5a4a" stroke="#4a2f1b" stroke-width="3"/><path d="M63 12 Q71 6 76 14 M67 4 Q80 -2 86 12" stroke="#ffcf3f" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M37 12 Q29 6 24 14 M33 4 Q20 -2 14 12" stroke="#ffcf3f" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg><span class="sign"><b>특수 임무</b><small id="c-elite"></small></span></button>
    </div>
  </footer>
</div>
<div id="overlay"></div>
<div id="boot"><div class="bootin"><div class="tlogo"><h1>군인 랜덤 디펜스</h1></div>
  <div class="bload"><span class="bar"><u></u></span><small id="boot-msg">불러오는 중…</small></div></div></div>
<div id="toast"></div>
<script>
// 시작 점검: 내려받은 새 버전이 시작에 실패하면(지난번 실행 때, 또는 이번 실행에서 5초 안에 못 뜨면)
// 그 버전을 버리고 앱에 든 버전으로 돌아간다. 정상으로 뜨면 main.js가 srd_boot_ok를 적는다.
(function () { try {
  var b = localStorage.getItem('srd_live_build'); if (!b) return;
  var ok = function () { return localStorage.getItem('srd_boot_ok') === b; };
  var rollback = function () {
    localStorage.removeItem('srd_live_build'); localStorage.setItem('srd_live_bad', b);
    caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k.indexOf('srd-live') === 0; }).map(function (k) { return caches.delete(k); })); })
      .then(function () { location.reload(); });
  };
  if (localStorage.getItem('srd_boot_try') === b && !ok()) { rollback(); return; }
  localStorage.setItem('srd_boot_try', b);
  setTimeout(function () { if (!ok()) rollback(); }, 5000);
} catch (e) {} })();
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
