<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b2118">
<title>군인 랜덤 디펜스</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud1">
      <div class="area"><span data-ic="flag"></span><div><small id="h-area">작전 지역</small><b><span id="h-wave">0</span> <em>/ 100 단계</em></b></div></div>
      <div class="next"><small>다음 웨이브<b id="h-next">-</b></small><span class="bar"><u id="h-nextbar"></u></span></div>
      <button id="b-speed" class="hbtn">×1</button>
      <button id="b-menu" class="hbtn" aria-label="메뉴"><span data-ic="menu"></span></button>
    </div>
    <div class="hud2">
      <div class="gauge" id="g-enemy"><span data-ic="skull"></span><div><span class="bar red"><u id="h-enemybar"></u></span><small id="h-enemy">적 0 / 50</small></div></div>
      <div class="pill gold"><span data-ic="coin"></span><b id="h-gold">0</b></div>
      <div class="pill sup"><span data-ic="box"></span><b id="h-sup">0</b></div>
    </div>
  </header>
  <canvas id="field"></canvas>
  <section id="info"></section>
  <footer id="actions">
    <div class="quick">
      <button id="b-mission"><span data-ic="list"></span><span>임무 <b id="c-mission"></b></span></button>
      <button id="b-codex"><span data-ic="book"></span><span>조합 도감</span></button>
    </div>
    <div class="dock">
      <button id="b-camp" class="dk"><span data-ic="tent"></span><b id="t-camp">훈련소</b><small id="c-camp"></small></button>
      <button id="b-pick" class="dk"><span data-ic="hand"></span><b>선택 소집</b><small id="c-pick"></small></button>
      <button id="b-summon" class="dk main"><span data-ic="plus"></span><b>신병 소집</b><small id="c-summon"></small></button>
      <button id="b-up" class="dk"><span data-ic="up"></span><b>병과 강화</b><small id="c-up"></small></button>
      <button id="b-elite" class="dk"><span data-ic="target"></span><b>특수 임무</b><small id="c-elite"></small><i class="dot"></i></button>
    </div>
  </footer>
</div>
<div id="overlay"></div>
<div id="toast"></div>
<script>
// 시작 점검: 내려받은 새 버전이 시작에 실패하면(지난번 실행 때, 또는 이번 실행에서 5초 안에 못 뜨면)
// 그 버전을 버리고 앱에 든 버전으로 돌아간다. 정상으로 뜨면 main.js가 srd_boot_ok를 적는다.
(function () { try {
  var b = localStorage.getItem('srd_live_build'); if (!b) return;
  var ok = function () { return localStorage.getItem('srd_boot_ok') === b; };
  var rollback = function () {
    localStorage.removeItem('srd_live_build'); localStorage.setItem('srd_live_bad', b);
    caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k.indexOf('srd-live') === 0; }).map(function (k) { return caches.delete(k); })); })
      .then(function () { location.reload(); });
  };
  if (localStorage.getItem('srd_boot_try') === b && !ok()) { rollback(); return; }
  localStorage.setItem('srd_boot_try', b);
  setTimeout(function () { if (!ok()) rollback(); }, 5000);
} catch (e) {} })();
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
