<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b2118">
<title>털뭉치수비대</title>
<link rel="icon" type="image/png" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="area"><span data-ic="flag"></span><div><b><span id="h-wave">0</span><em id="h-max">/100</em></b><small id="h-area">작전 지역</small></div></div>
    <div class="meters">
      <div class="mt"><small>다음 <b id="h-next">-</b></small><span class="bar"><u id="h-nextbar"></u></span></div>
      <div class="mt" id="g-enemy"><small id="h-enemy">적 0/50</small><span class="bar red"><u id="h-enemybar"></u></span></div>
    </div>
    <div class="pill gold"><span data-ic="coin"></span><b id="h-gold">0</b></div>
    <div class="pill sup"><span data-ic="box"></span><b id="h-sup">0</b></div>
    <button id="b-speed" class="hbtn">×1</button>
    <button id="b-menu" class="hbtn" aria-label="메뉴"><span data-ic="menu"></span></button>
  </header>
  <canvas id="field"></canvas>
  <section id="info"></section>
  <!-- 주둔지: 버튼 대신 전장 아래 주둔지의 건물(그림 img/bld_*.webp)을 누른다. 왼쪽부터 훈련소(천막) · 병기창(병과 강화) · 연병장(신병 소집) · 보급창(보급병 고용 · 선택 소집) · 통신탑(특수 임무) -->
  <footer id="actions">
    <div class="ticker"><p id="t-info">신병을 소집하세요</p><button id="b-coop" class="board" hidden>협동</button><button id="b-mission" class="board"><span data-ic="list"></span>임무 <b id="c-mission"></b></button></div>
    <div class="brief"><img id="brief-img" alt=""><div><small id="brief-w"></small><b id="brief-t"></b><p id="brief-s"></p></div></div>
    <div class="blds">
      <button id="b-camp" class="bld"><img class="bimg" src="img/bld_camp.webp" alt=""><span class="sign"><b id="t-camp">훈련소</b><small id="c-camp"></small></span></button>
      <button id="b-up" class="bld"><img class="bimg" src="img/bld_up.webp" alt=""><span class="sign"><b>병과 강화</b><small id="c-up"></small></span></button>
      <button id="b-summon" class="bld main"><img class="bimg" src="img/bld_summon.webp" alt=""><span class="sign"><b>신병 소집</b><small id="c-summon"></small></span></button>
      <button id="b-pick" class="bld"><img class="bimg" src="img/bld_pick.webp" alt=""><span class="sign"><b>보급창</b><small id="c-pick"></small></span></button>
      <button id="b-elite" class="bld"><img class="bimg" src="img/bld_elite.webp" alt=""><span class="sign"><b>특수 임무</b><small id="c-elite"></small></span></button>
    </div>
  </footer>
</div>
<div id="overlay"></div>
<div id="boot"><div class="bootin"><div class="tlogo"><h1>털뭉치수비대</h1></div>
  <div class="bload"><span class="bar"><u></u></span><small id="boot-msg">불러오는 중…</small></div></div></div>
<div id="toast"></div>
<script>
// 시작 점검: 내려받은 새 버전이 시작에 실패하면(지난번 실행 때, 또는 이번 실행에서 5초 안에 못 뜨면)
// 그 버전을 버리고 앱에 든 버전으로 돌아간다. 정상으로 뜨면 main.js가 srd_boot_ok를 적는다.
(function () { try {
  var b = localStorage.getItem('srd_live_build'); if (!b) return;
  var ok = function () { return localStorage.getItem('srd_boot_ok') === b; };
  var rollback = function () {
    localStorage.removeItem('srd_live_build'); localStorage.setItem('srd_live_bad', b);
    caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k.indexOf('srd-live') === 0; }).map(function (k) { return caches.delete(k); })); })
      .then(function () { location.reload(); });
  };
  if (localStorage.getItem('srd_boot_try') === b && !ok()) { rollback(); return; }
  localStorage.setItem('srd_boot_try', b);
  setTimeout(function () { if (!ok()) rollback(); }, 5000);
} catch (e) {} })();
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
